<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Content</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .premium-container {
      max-width: 800px;
      margin: 4rem auto;
      padding: 2rem;
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      border-left: 6px solid #66d9ff;
    }
    .premium-container h1 {
      color: #0b1a2e;
      text-align: center;
    }
    .premium-content {
      background: #f4f7fc;
      padding: 1.5rem;
      border-radius: 12px;
      margin: 1.5rem 0;
    }
    .premium-content ul {
      list-style: none;
      padding: 0;
    }
    .premium-content li {
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .premium-content li:last-child {
      border-bottom: none;
    }
    .btn-primary {
      display: inline-block;
      padding: 0.8rem 2rem;
      background: #0b1a2e;
      color: white;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
    }
    .btn-primary:hover {
      background: #66d9ff;
      color: #0b1a2e;
      transform: translateY(-3px);
    }
    .btn-premium {
      display: inline-block;
      padding: 0.8rem 2rem;
      background: #ffc107;
      color: #0b1a2e;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 1rem;
      transition: 0.3s;
    }
    .btn-premium:hover {
      background: #ffca2c;
      transform: translateY(-3px);
    }
  </style>
</head>
<body>
  <div class="premium-container">
    <h1>📖 Premium Content</h1>
    <p>Welcome to the Premium section!</p>
    <div class="premium-content">
      <h2>Exclusive Diary Entries</h2>
      <p>This is your premium content. You can add:</p>
      <ul>
        <li>Personal stories</li>
        <li>Exclusive photos</li>
        <li>Audio/video content</li>
        <li>PDF downloads</li>
      </ul>
    </div>
    <a href="index.html" class="btn-primary">⬅ Back to Home</a>
  </div>
</body>
</html>
